name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A boolean, never the token's value: secrets are not exposed to Dependabot or
      # fork-triggered runs, so it is false there and the SonarQube steps below are
      # skipped so the build and tests still run. The token itself is in the `env` of
      # the two SonarQube steps only.
      SONAR_ENABLED: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Censio.slnx

      - name: Check tool versions
        run: |
          cli=$(jq -r '.tools["reihitsu.cli"].version // empty' .config/dotnet-tools.json)
          analyzer=$(sed -n 's/.*<PackageVersion Include="Reihitsu.Analyzer" Version="\([^"]*\)".*/\1/p' Directory.Packages.props | head -n 1)
          if [ -z "$cli" ] || [ -z "$analyzer" ] || [ "${cli%.*}" != "${analyzer%.*}" ]; then
            echo "::error::Reihitsu.Cli ${cli:-<missing>} (.config/dotnet-tools.json) and Reihitsu.Analyzer ${analyzer:-<missing>} (Directory.Packages.props) are on different release lines; raise Reihitsu.Cli in the tool manifest"
            exit 1
          fi

      - name: Format check
        run: dotnet tool run reihitsu-format --check ./

      - name: Begin SonarQube analysis
        id: sonar-begin
        if: env.SONAR_ENABLED == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet tool run dotnet-sonarscanner begin \
            /k:"networlddev_censio" \
            /o:"networlddev" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="${{ runner.temp }}/TestResults/**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions=".squad/**,.claude/**,src/Censio.Companion/**"

      - name: Build
        run: dotnet build Censio.slnx -c Release --no-restore

      - name: Test
        id: test
        run: >
          dotnet test Censio.slnx
          -c Release --no-build
          --logger trx
          --collect:"XPlat Code Coverage"
          --results-directory ${{ runner.temp }}/TestResults
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End SonarQube analysis
        if: ${{ !cancelled() && steps.sonar-begin.outcome == 'success' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet tool run dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Publish test report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        # Creating check runs needs a writable token, which Dependabot and
        # fork-triggered runs do not get. Skip there; the test step itself
        # still fails the job on a failing test.
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork != true && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        with:
          name: dotnet tests
          path: ${{ runner.temp }}/TestResults/**/*.trx
          reporter: dotnet-trx

      - name: Upload test & coverage artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/TestResults/**/*.trx
            ${{ runner.temp }}/TestResults/**/coverage.opencover.xml
          if-no-files-found: warn

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build and check the server image
        run: bash .github/scripts/image-check.sh
