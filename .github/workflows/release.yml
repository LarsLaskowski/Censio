name: Release

# A release is published as a pre-release; the run builds and checks the artifacts without any secret, publishes them
# and only then promotes the release (record 0012). Event and job-output values reach a script only through `env` and
# are checked with `release-check.sh form` before the credentialed jobs use them. No cache of any kind (record 0008).
# The Docker Hub secrets are secrets of the environment `release`, which admits only `v*` tags (record 0012).
# A tag that is not the highest `v*` version is refused in `check` and again in `promote` (record 0012).
on:
  release:
    types: [ published ]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0  # the tagged commit must be tested against the whole history of main
          persist-credentials: false

      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(bash .github/scripts/release-check.sh tag "$TAG")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check that the tag is on main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: bash .github/scripts/release-check.sh on-main "$TAG" origin/main

      - name: Check that the tag is the highest version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: bash .github/scripts/release-check.sh newest "$TAG"

      - name: Check that the release is a pre-release
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: bash .github/scripts/release-check.sh prerelease "$TAG" "$PRERELEASE"

  companion-build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check the version
        run: bash .github/scripts/release-check.sh form version version "$VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build and check the Companion ZIP
        id: zip
        run: |
          archive="$(bash .github/scripts/release-check.sh companion "$VERSION" "$RUNNER_TEMP/companion")"
          echo "path=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload the ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion-zip
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  image-build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    outputs:
      image-id: ${{ steps.build.outputs.image-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check the version
        run: bash .github/scripts/release-check.sh form version version "$VERSION"

      - name: Build and check the server image
        id: build
        run: |
          image_id="$(bash .github/scripts/release-check.sh image "$VERSION" "censio-release:$VERSION")"
          echo "image-id=$image_id" >> "$GITHUB_OUTPUT"
          docker save -o "$RUNNER_TEMP/censio-image.tar" "censio-release:$VERSION"

      - name: Upload the image archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-image
          path: ${{ runner.temp }}/censio-image.tar
          if-no-files-found: error
          retention-days: 7

  companion-publish:
    needs: [ check, companion-build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check the version
        run: bash .github/scripts/release-check.sh form version version "$VERSION"

      - name: Download the ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: companion-zip
          path: ${{ runner.temp }}/companion-zip

      - name: Attach the ZIP to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/companion-zip/Censio-${VERSION}-win-x64.zip" --clobber

  image-publish:
    needs: [ check, image-build ]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
      IMAGE_ID: ${{ needs.image-build.outputs.image-id }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check the passed values
        run: |
          bash .github/scripts/release-check.sh form version version "$VERSION"
          bash .github/scripts/release-check.sh form digest image-id "$IMAGE_ID"

      - name: Check the Docker Hub credentials
        env:
          USER_SET: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          TOKEN_SET: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: bash .github/scripts/release-check.sh dockerhub-secrets "$USER_SET" "$TOKEN_SET"

      - name: Download the image archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-image
          path: ${{ runner.temp }}/server-image

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Push the checked image
        id: push
        run: |
          digest="$(bash .github/scripts/release-check.sh push "$RUNNER_TEMP/server-image/censio-image.tar" "$IMAGE_ID" networlddev/censio "$VERSION")"
          bash .github/scripts/release-check.sh form digest digest "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Log out of Docker Hub
        if: always()
        run: docker logout

  promote:
    needs: [ check, companion-publish, image-publish ]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      DIGEST: ${{ needs.image-publish.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0  # compare the tag with every v* tag right before latest moves
          persist-credentials: false

      - name: Check the passed values
        run: |
          bash .github/scripts/release-check.sh form version version "$VERSION"
          bash .github/scripts/release-check.sh form digest digest "$DIGEST"

      - name: Check that the tag is still the highest version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: bash .github/scripts/release-check.sh newest "$TAG"

      - name: Check the Docker Hub credentials
        env:
          USER_SET: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          TOKEN_SET: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: bash .github/scripts/release-check.sh dockerhub-secrets "$USER_SET" "$TOKEN_SET"

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Move latest to the checked image
        run: bash .github/scripts/release-check.sh promote-image networlddev/censio "$DIGEST"

      - name: Log out of Docker Hub
        if: always()
        run: docker logout

      - name: Mark the release as the latest full release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release edit "$TAG" --prerelease=false --latest
